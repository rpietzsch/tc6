name: Prüfung

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  kapitel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kapitel prüfen
        run: node tests/validate-kapitel.js

  browser:
    runs-on: ubuntu-latest
    needs: kapitel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Rauchtest im Browser
        run: node tests/smoke-reset.js
